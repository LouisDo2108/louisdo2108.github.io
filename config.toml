fig0 = "fig. 0 — labels survive, neighbours don't · <a href=\"#why-retrieval\">adapted from DAR ↓</a>"
viz_caption = "Squares are image embeddings, circles are captions, and colours are concepts. When the encoder is fine-tuned on task <em>t+1</em> (new data: strawberries), old embeddings drift; faint ghosts mark where they were. They stay inside their class regions, so <strong>classification accuracy holds</strong>. But nearest neighbours reshuffle, the right caption leaves the top-<em>k</em>, and <strong>Recall@1 collapses</strong>. Retrieval needs methods that preserve the <em>geometry</em> of the space, not just the labels."
viz_credit = "Adapted from a figure in <em>Beyond Classification: Dynamic Adapter Routing for Continual Multimodal Retrieval</em>. The points are illustrative, not real model embeddings."
