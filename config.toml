# Zola configuration — https://www.getzola.org/documentation/getting-started/configuration/
base_url = "https://louisdo2108.github.io"
title = "Tuan-Luc Huynh"
author = "Tuan-Luc Huynh"
description = "Tuan-Luc Huynh (Louis Do) — PhD researcher at Monash University working on continual adaptation of neural retrieval: generative and dense retrievers, RAG and multimodal retrieval."
default_language = "en"

compile_sass = true
minify_html = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "tags", feed = true },
]

[markdown]
highlight_code = true
highlight_theme = "css"
highlight_themes_css = [
  { theme = "one-dark", filename = "syntax.css" },
]
smart_punctuation = true
external_links_target_blank = true
external_links_no_referrer = true

[slugify]
paths = "safe"
anchors = "on"

